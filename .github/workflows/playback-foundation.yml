name: S3K playback foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Java temporary storage
        run: printf 'JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify snapshot and extraction tests
        run: |
          python3 tools/openggf_audio.py check
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s tools/transcribers/basic-pitch -v
          python3 -m unittest discover -s tools/transcribers/adtof -v
          python3 -m pip install numpy scipy
          python3 -m unittest discover -s tools/transcribers/rmvpe -v
      - name: Ensure ffmpeg is available for export tests
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Build and test headless playback
        run: mvn -B -pl headless -am verify
      - name: Exercise the stdio MCP server
        run: python3 -I tools/mcp_smoke.py headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar --scratch "$RUNNER_TEMP"
      - name: Exercise the packaged CLI and verify bundled provenance
        run: |
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar demo "$RUNNER_TEMP/demo.wav" --frames 120
          python3 - "$RUNNER_TEMP/demo.wav" <<'PY'
          import hashlib, json, pathlib, sys, wave, zipfile
          with wave.open(sys.argv[1], 'rb') as wav:
              assert (wav.getnchannels(), wav.getsampwidth(), wav.getframerate(), wav.getnframes()) == (2, 2, 48000, 96000)
              assert hashlib.sha256(wav.readframes(96000)).hexdigest() == 'acc6a3d5f35d293356edf1efb08401734348b41f2eb2b673e1a7c01128100451'
          lock_bytes = pathlib.Path('upstream/openggf-audio.lock.json').read_bytes()
          lock = json.loads(lock_bytes)
          with zipfile.ZipFile('headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar') as jar:
              base = 'META-INF/openggf-audio/'
              assert jar.read(base + 'openggf-audio.lock.json') == lock_bytes
              for entry in lock['files']:
                  content = jar.read(base + 'sources/' + entry['path'].removeprefix('src/main/java/'))
                  assert hashlib.sha256(content).hexdigest() == entry['vendoredSha256'], entry['path']
              for entry in lock['licenses']:
                  assert hashlib.sha256(jar.read(base + entry['destination'])).hexdigest() == entry['vendoredSha256'], entry['path']
          PY
      - name: Build and test editable Studio on an isolated display
        run: |
          mkdir -p studio/target/qa
          xvfb-run -a -s '-screen 0 1600x1000x24' mvn -B -pl studio -am verify -Dstudio.ui.test=true -Dstudio.snapshot=target/qa/editor.png
          xvfb-run -a -s '-screen 0 1600x1000x24' java -cp "studio/target/opensmpsdeck-studio-0.1.0-SNAPSHOT.jar:studio/target/test-classes" com.opensmpsdeck.studio.PackagedStudioSmoke examples/lantern-walk.smps.json studio/target/qa/packaged.png
      - name: Validate and render shared project source
        run: |
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar validate-project examples/lantern-walk.smps.json
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar render-project examples/lantern-walk.smps.json "$RUNNER_TEMP/project.wav" --frames 1800
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar validate-project examples/native-controls.smps.json
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar render-project examples/native-controls.smps.json "$RUNNER_TEMP/native-controls.wav" --frames 1800
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar validate-project examples/voices-and-envelopes.smps.json
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar render-project examples/voices-and-envelopes.smps.json "$RUNNER_TEMP/voices-and-envelopes.wav" --frames 1800
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar compile-package examples/voices-and-envelopes.smps.json "$RUNNER_TEMP/voices-and-envelopes.smps.zip"
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar validate-project examples/dac-percussion.smps.json
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar render-project examples/dac-percussion.smps.json "$RUNNER_TEMP/dac-percussion.wav"
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar compile-package examples/dac-percussion.smps.json "$RUNNER_TEMP/dac-percussion.smps.zip"
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar inspect-project examples/native-evening-clock.smps.json
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar render-project examples/native-evening-clock.smps.json "$RUNNER_TEMP/native-evening-clock.wav"
          java -jar headless/target/opensmpsdeck-headless-0.1.0-SNAPSHOT.jar compile-package examples/native-evening-clock.smps.json "$RUNNER_TEMP/native-evening-clock.smps.zip"
      - name: Verify native DPI and physical pointer editing
        run: python3 tools/verify_studio_dpi.py --scratch "$RUNNER_TEMP"
      - name: Fetch only the locked upstream commit
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("upstream/openggf-audio.lock.json"))["revision"])')
          git init "$RUNNER_TEMP/openggf-reference"
          git -C "$RUNNER_TEMP/openggf-reference" fetch --depth=1 https://github.com/OpenGGF/OpenGGF.git "$revision"
      - name: Verify provenance and independent playback parity
        run: |
          python3 tools/openggf_audio.py check --source "$RUNNER_TEMP/openggf-reference"
          python3 tools/verify_openggf_audio_parity.py --source "$RUNNER_TEMP/openggf-reference" --scratch "$RUNNER_TEMP"
